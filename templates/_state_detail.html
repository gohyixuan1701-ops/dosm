<div class="state-detail-wrap" style="--state-color: {{ state.colour }}">
  <div class="detail-top"><div><div class="section-kicker">{{ state.code }} • STATE PROFILE</div><h3>{{ state_name }}</h3></div><span class="growth-badge">{{ state.growth }}</span></div>
  <div class="detail-number"><span>Forecast visitors, 2026</span><strong>{{ state.visitors }}</strong></div>
  <div class="detail-divider"></div>
  <div class="detail-label">DESTINATION SIGNALS</div>
  <div class="highlight-list">
    {% for place in state.highlights %}<span>◉ {{ place }}</span>{% endfor %}
  </div>
</div>
